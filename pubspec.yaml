name: vendervpn
description: "VenderVPN — V2Ray VPN & Proxy Client (Beta)"
publish_to: 'none'

version: 1.0.0-beta.1+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  path_provider: ^2.1.1
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  lottie: ^3.3.1
  #unity_ads_plugin: ^0.3.26
  dartz: ^0.10.1
  equatable: ^2.0.7
  get_it: ^9.2.1
  appwrite: ^26.1.0
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  shared_preferences: ^2.5.3
  avatar_glow: ^3.0.1
  flutter_bounceable: ^1.2.0
  flutter_svg: ^2.2.1
  country_flags: ^4.0.1
  flutter_v2ray_client:
    path: packages/flutter_v2ray_client
  countries_world_map: ^1.3.0
  google_mobile_ads: ^9.1.0
  toastification: ^3.0.3
  flutter_web_auth_2: ^5.1.0
  mobile_scanner: ^7.0.0
  installed_apps: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/animations/