name: vendervpn
description: "VenderVPN — V2Ray VPN & Proxy Client (Beta)"
publish_to: 'none'

version: 1.0.0-beta.1+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  dartz: ^0.10.1
  equatable: ^2.0.7
  get_it: ^9.2.1
  appwrite: ^26.1.0
  go_router: ^18.0.1
  shared_preferences: ^2.5.3
  flutter_bounceable: ^1.2.0
  country_flags: ^4.0.1
  flutter_v2ray_client:
    git:
      url: https://github.com/Omidbabadi/flutter_v2ray_client.git
      ref: main # Optional: pin to your branch name to ensure predictable CI fetches
  google_mobile_ads: ^9.1.0
  toastification: ^3.0.3
  mobile_scanner: ^7.0.0
  installed_apps: ^2.2.1
  flutter_secure_storage: ^11.2.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

flutter:
  generate: true
  uses-material-design: true